[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dataops-copilot"
version = "0.1.0"
description = "A local-first learning project for reliable DataOps and an evidence-grounded Copilot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ai-dataops-ingest = "ai_dataops.ingestion:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
